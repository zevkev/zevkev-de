name: Refresh VOD feed & Twitch live status

on:
  schedule:
    # Was */5 -- checked the actual run history in the Actions tab and found
    # GitHub was only firing it every 6-8 hours in practice regardless (a
    # documented GitHub behavior: very-short-interval cron schedules get
    # heavily throttled/skipped on lower-traffic repos, no matter what the
    # cron expression says). 30 minutes is far more likely to actually be
    # honored close to on-schedule -- confirm by checking real run timestamps
    # in Actions after this has been live a while, not just trusting the
    # declared interval.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch YouTube VOD feed
        # continue-on-error for the same reason as the two steps below: this
        # hits YouTube's public RSS endpoint unauthenticated, which has been
        # observed to blip with a transient 404/5xx (not a real channel
        # problem -- the same URL succeeds again moments later). Without
        # this, one blip here used to kill the whole job and block the main
        # feed + Twitch status steps from running too, even though neither
        # depends on this one succeeding.
        continue-on-error: true
        run: node scripts/fetch-vod-feed.mjs

      - name: Fetch YouTube main channel feed
        # continue-on-error so a not-yet-configured (or quota-exhausted)
        # YOUTUBE_API_KEY never blocks the Twitch status step or the commit
        # step below — same reasoning as the Twitch step's continue-on-error
        # just below. See the setup comment atop scripts/fetch-main-feed.mjs
        # for how to create/add that secret.
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-main-feed.mjs

      - name: Fetch Twitch live status
        # continue-on-error so a missing/not-yet-configured Twitch secret never
        # blocks the YouTube feeds below from updating and committing. The
        # real on/off switch for Twitch features is TWITCH_ENABLED in
        # js/config.js (client-side); this just keeps live-status.json fresh
        # whenever the secrets happen to be present.
        continue-on-error: true
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node scripts/fetch-twitch-status.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/videos.json assets/data/main-videos.json assets/data/live-status.json assets/data/twitch-vods.json
          git diff --cached --quiet || git commit -m "chore: refresh video feeds & live status"
          git push
