name: Refresh VOD feed & Twitch live status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch YouTube VOD feed
        run: node scripts/fetch-vod-feed.mjs

      - name: Fetch YouTube main channel feed
        # continue-on-error so a not-yet-configured (or quota-exhausted)
        # YOUTUBE_API_KEY never blocks the Twitch status step or the commit
        # step below — same reasoning as the Twitch step's continue-on-error
        # just below. See the setup comment atop scripts/fetch-main-feed.mjs
        # for how to create/add that secret.
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-main-feed.mjs

      - name: Fetch Twitch live status
        # continue-on-error so a missing/not-yet-configured Twitch secret never
        # blocks the YouTube feeds below from updating and committing. The
        # real on/off switch for Twitch features is TWITCH_ENABLED in
        # js/config.js (client-side); this just keeps live-status.json fresh
        # whenever the secrets happen to be present.
        continue-on-error: true
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node scripts/fetch-twitch-status.mjs

      - name: Fetch USD->EUR exchange rate
        # continue-on-error for the same reason as the steps above: the API
        # (Frankfurter, free and keyless — no secret needed) being briefly
        # unreachable should never block the other feeds or the commit step.
        # js/currency.js falls back to showing USD if this file is ever
        # missing/stale, so a skipped run here is never a broken shop.
        continue-on-error: true
        run: node scripts/fetch-exchange-rate.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/videos.json assets/data/main-videos.json assets/data/live-status.json assets/data/twitch-vods.json assets/data/exchange-rate.json
          git diff --cached --quiet || git commit -m "chore: refresh video feeds & live status"
          git push
