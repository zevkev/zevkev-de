<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden | ZevKev</title>
<meta name="description" content="Diese Seite gibt es nicht (mehr).">

<link rel="icon" type="image/png" href="https://zevkev.github.io/Medienspeicher/Bilder/neues%20icon.png">
<link rel="apple-touch-icon" href="https://zevkev.github.io/Medienspeicher/Bilder/neues%20icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<meta property="og:type" content="website">
<meta property="og:title" content="Seite nicht gefunden | ZevKev">
<meta property="og:description" content="Diese Seite gibt es nicht (mehr).">
<meta property="og:image" content="https://zevkev.github.io/Medienspeicher/Bilder/ZevKev.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://zevkev.github.io/Medienspeicher/Bilder/ZevKev.png">

<!--
  GitHub Pages has no server-side rewrites/routing config — this is the
  standard static-host workaround for pretty URLs: GitHub Pages serves this
  exact file, from the repo ROOT (the only place it's honored — it will NOT
  be picked up from e.g. shop/404.html), for ANY unmatched path site-wide,
  with an HTTP 404 status code (the page itself still renders and works
  normally for visitors; search engines/some tools just won't index these
  URLs as "real" pages — an accepted, unavoidable tradeoff of this technique
  on GitHub Pages specifically, not a bug here).

  This page is structurally identical to shop/product/index.html and
  watch/index.html on purpose: when the unmatched path looks like a clean
  product URL (/shop/<slug>) or a clean video URL (/video/<id> or
  /vod/<id> — see the inline script below), it loads the exact same
  js/product.js or js/watch.js used on those real pages, both of which
  already know how to pull their id out of location.pathname when there's
  no query string. Nothing about either page's rendering is duplicated here.

  All /js/, /css/ etc. references below are root-absolute, so they resolve
  correctly no matter what URL this was actually served for (this file
  itself lives at the repo root either way).
-->

<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/shop.css">
<link rel="stylesheet" href="/css/vods.css">
<link rel="stylesheet" href="/css/youtube.css">
<link rel="stylesheet" href="/css/watch.css">
<link rel="stylesheet" href="/css/profil.css">
</head>
<body>

<script type="module" src="/js/theme.js"></script>
<script type="module" src="/js/consent.js"></script>

<div id="site-header"></div>

<div class="page-body">
  <div class="container" id="fallback-container">
    <a href="/shop/" class="shop-back-link" id="shop-back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Zurück zum Shop
    </a>

    <div id="product-root"></div>

    <div class="watch-page" id="watch-page" style="display:none;">
      <div class="watch-player-wrap" id="watch-player"><div class="skeleton-card player-skeleton"></div></div>
      <div class="watch-meta rip" id="watch-meta"></div>
    </div>
    <div class="comments-section rip" id="comments-root" style="display:none;"></div>

    <div id="profil-root" class="profil-root" style="display:none;"></div>

  </div>
</div>

<div id="site-footer"></div>

<script type="module" src="/js/flags.js"></script>
<script type="module">
  import { mountLayout } from "/js/layout.js";
  mountLayout();
</script>
<script>
  // Which real page's script (if any) this unmatched path actually maps to.
  // Anything that doesn't match one of these shapes (a typo'd path anywhere
  // else on the site, a link to a removed page, etc.) gets a plain generic
  // "not found" message instead of borrowing either page's own wording.
  const parts = location.pathname.split("/").filter(Boolean);
  const looksLikeProductSlug = parts.length === 2 && parts[0] === "shop" && parts[1] !== "product";
  const looksLikeWatchPath = parts.length === 2 && (parts[0] === "video" || parts[0] === "vod");
  const looksLikeUserProfile = parts.length === 2 && parts[0] === "user";

  if (looksLikeProductSlug) {
    const script = document.createElement("script");
    script.type = "module";
    script.src = "/js/product.js";
    document.body.appendChild(script);
  } else if (looksLikeWatchPath) {
    document.getElementById("shop-back-link").style.display = "none";
    document.getElementById("watch-page").style.display = "";
    document.getElementById("comments-root").style.display = "";
    // watch/index.html's own .container carries this same inline style
    // (its content, unlike the product page's grid, needs to be a centered
    // column) -- applied here in JS since this container is shared with the
    // product-slug branch above, which must NOT get it.
    const container = document.getElementById("fallback-container");
    container.style.display = "flex";
    container.style.flexDirection = "column";
    container.style.alignItems = "center";
    const script = document.createElement("script");
    script.type = "module";
    script.src = "/js/watch.js";
    document.body.appendChild(script);
  } else if (looksLikeUserProfile) {
    document.getElementById("shop-back-link").style.display = "none";
    document.getElementById("profil-root").style.display = "";
    // profil.js's own getUsernameFromLocation() already reads the /user/<name>
    // path shape directly (see that file) -- no query string needed here.
    const script = document.createElement("script");
    script.type = "module";
    script.src = "/js/profil.js";
    document.body.appendChild(script);
  } else {
    // A truly unmatched path (typo, removed page, dead external link) --
    // not shop-specific, so the "Zurück zum Shop" link from the branches
    // above would be misleading here and is hidden instead.
    document.getElementById("shop-back-link").style.display = "none";
    const root = document.getElementById("product-root");
    if (root) {
      // A dedicated card, not a reuse of the plain .empty-state/.notfound-state
      // treatment shared with the account/privat login gates and profil.js's
      // own not-found message -- those sit inline within an already-decorated
      // page, so bare white text on the dark mat reads fine there. This is a
      // whole standalone page with nothing else around it, and used to just
      // float that same bare text in a sea of empty dark mat with a single
      // way forward -- reads as noticeably plainer than every other page on
      // the site, which is presumably what "looks bad" referred to. Wrapped
      // in the same .rip torn-paper card + tape accent the legal pages use,
      // with a few quick links below the primary CTA so a visitor who
      // followed a dead link has more than one path back into the site.
      root.innerHTML = `
        <div class="notfound-card rip rip--b">
          <div class="tape"></div>
          <div class="notfound-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5l-2 5-5 2 2-5 5-2z"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
          </div>
          <p class="notfound-number">404</p>
          <h2>Seite nicht gefunden</h2>
          <p>Diese Seite gibt es nicht (mehr). Vielleicht ist der Link falsch oder veraltet.</p>
          <a href="/" class="p-btn rip btn-accent">Zur Startseite</a>
          <div class="notfound-links">
            <a href="/shop/">Shop</a>
            <a href="/youtube/">YouTube</a>
            <a href="/vods/">Mehr</a>
          </div>
        </div>`;
    }
  }
</script>
</body>
</html>
