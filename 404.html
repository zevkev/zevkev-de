<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seite nicht gefunden | ZevKev</title>
<meta name="description" content="Diese Seite gibt es nicht (mehr).">
<link rel="icon" type="image/png" href="https://zevkev.github.io/Medienspeicher/Bilder/neues%20icon.png">
<link rel="apple-touch-icon" href="https://zevkev.github.io/Medienspeicher/Bilder/neues%20icon.png">
<meta name="theme-color" content="#234d70">
<link rel="preload" href="/assets/fonts/jost-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/bebas-neue-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/app.css">
<script src="/js/boot.js"></script>

<meta property="og:type" content="website">
<meta property="og:title" content="ZevKev">
<meta property="og:description" content="Videos, Streams und Merch von ZevKev.">
<meta property="og:image" content="https://zevkev.github.io/Medienspeicher/Bilder/ZevKev.png">
<meta property="og:url" content="https://zevkev.de/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://zevkev.github.io/Medienspeicher/Bilder/ZevKev.png">

<!--
  GitHub Pages serves this file (only from the repo root) for every path
  that has no real file, with HTTP status 404. It does three jobs:
  1. /shop/<slug> renders the product page with js/product.js (clean product
     URLs, GitHub Pages has no rewrites).
  2. Old shared links of removed pages forward to where that content lives
     now (location.replace, so the dead URL doesn't stay in the history).
  3. Anything else shows the "Seite nicht gefunden" card.
  All asset paths are root absolute because this renders at any URL.
-->
<script>
  (function () {
    var root = document.documentElement;
    var parts = location.pathname.split("/").filter(Boolean);
    var first = (parts[0] || "").toLowerCase();
    var id = parts[1] || "";
    try { id = decodeURIComponent(id); } catch (e) {}

    function go(url) {
      root.setAttribute("data-route", "redirect");
      location.replace(url);
    }

    if (first === "video") {
      go(id ? "https://www.youtube.com/watch?v=" + encodeURIComponent(id) : "/youtube/");
    } else if (first === "vod") {
      go(id ? "https://www.twitch.tv/videos/" + encodeURIComponent(id) : "/vods/");
    } else if (first === "watch") {
      // Old player page: /watch/?id=<id>&type=video|vod
      var params = new URLSearchParams(location.search);
      var wid = params.get("id");
      if (!wid) go("/");
      else if (params.get("type") === "vod") go("https://www.twitch.tv/videos/" + encodeURIComponent(wid));
      else go("https://www.youtube.com/watch?v=" + encodeURIComponent(wid));
    } else if (first === "live") {
      go("/vods/");
    } else if (["watchlist", "account", "login", "profil", "privat", "user"].indexOf(first) !== -1) {
      go("/");
    } else if (parts[0] === "shop" && parts.length === 2 && parts[1] !== "product") {
      root.setAttribute("data-route", "product");
      document.title = "Produkt | ZevKev Shop";
    } else {
      root.setAttribute("data-route", "notfound");
    }
  })();
</script>
</head>
<body>
<div id="site-header"></div>

<main id="main" class="page">
  <div class="container-page">
    <div id="product-root"></div>

    <section id="notfound" class="paper paper-b mx-auto mt-4 max-w-xl px-6 pb-10 pt-12 text-center sm:px-12" aria-labelledby="notfound-title" hidden>
      <div class="tape left-1/2 -translate-x-1/2"></div>
      <p class="notfound-number" aria-hidden="true">404</p>
      <h1 id="notfound-title" class="mt-2 text-5xl">Seite nicht gefunden</h1>
      <p class="mx-auto mt-3 max-w-sm leading-relaxed text-ink-muted">Diese Seite gibt es nicht (mehr). Vielleicht ist der Link falsch oder schon etwas älter.</p>
      <a href="/" class="btn btn-accent btn-lg mt-7">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>
        Zur Startseite
      </a>
      <hr class="divider-dashed mx-auto mt-8 max-w-xs">
      <p class="mt-5 text-sm font-semibold text-ink-muted">Oder schau hier vorbei:</p>
      <nav class="mt-3 flex flex-wrap justify-center gap-2" aria-label="Beliebte Seiten">
        <a href="/shop/" class="btn btn-sm">Shop</a>
        <a href="/youtube/" class="btn btn-sm">YouTube</a>
        <a href="/vods/" class="btn btn-sm"><span data-twitch-soft>Mehr</span><span data-no-twitch>ZevKev+</span></a>
      </nav>
    </section>
  </div>
</main>

<div id="site-footer"></div>
<script>
  (function () {
    var route = document.documentElement.getAttribute("data-route");
    if (route === "notfound") {
      document.getElementById("notfound").hidden = false;
      var robots = document.createElement("meta");
      robots.name = "robots";
      robots.content = "noindex";
      document.head.appendChild(robots);
    } else if (route === "product") {
      var s = document.createElement("script");
      s.type = "module";
      s.src = "/js/product.js";
      document.body.appendChild(s);
    }
  })();
</script>
<script type="module" src="/js/layout.js"></script>
</body>
</html>
