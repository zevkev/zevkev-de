<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mehr | ZevKev</title>
<meta name="description" content="ZevKev live auf Twitch, vergangene Streams zum Nachschauen und die neuesten Videos vom VOD Kanal ZevKev+.">

<link rel="icon" type="image/png" href="https://zevkev.github.io/Medienspeicher/Bilder/neues%20icon.png">
<link rel="apple-touch-icon" href="https://zevkev.github.io/Medienspeicher/Bilder/neues%20icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<meta property="og:type" content="website">
<meta property="og:title" content="Mehr | ZevKev">
<meta property="og:description" content="Live auf Twitch, vergangene Streams und die neuesten Videos vom VOD Kanal ZevKev+.">
<meta property="og:image" content="https://zevkev.github.io/Medienspeicher/Bilder/ZevKev.png">
<link rel="canonical" href="https://zevkev.de/vods/">
<meta property="og:url" content="https://zevkev.de/vods/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://zevkev.github.io/Medienspeicher/Bilder/ZevKev.png">

<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/shop.css">
<link rel="stylesheet" href="/css/vods.css">
<link rel="stylesheet" href="/css/youtube.css">
</head>
<body class="vods-page">

<script type="module" src="/js/theme.js"></script>
<script type="module" src="/js/user-theme.js"></script>
<script type="module" src="/js/consent.js"></script>

<div id="site-header"></div>

<!-- Full-bleed hero (gronkh.tv structural reference): the current/live
     video fills the page width right under the fixed nav, which floats over
     it as a translucent bar instead of sitting in normal flow above it (see
     .vods-page .site-header in vods.css). This is the same player+chat
     pairing the page always had — js/vods.js just renders it into this new
     frame, with a scrimmed status bar (badge/title/stats/actions) near the
     hero's bottom edge instead of a caption printed below the player. -->
<section class="vod-hero" id="vod-hero" aria-label="Aktueller Stream">
  <div class="vod-hero-row">
    <div class="vod-hero-player" id="vod-hero-player"></div>
    <div class="vod-hero-chat" id="chat-col" data-twitch-only></div>
  </div>
  <div class="vod-hero-tear" aria-hidden="true"></div>
</section>
<div id="vod-hero-sentinel" aria-hidden="true"></div>

<div class="page-body">
  <div class="container" style="display:flex; flex-direction:column; align-items:center;">

    <!-- .yt-library/.scissor-line: the same paper-sheet card + torn-edge
         divider already used on youtube/index.html for its lower section
         (css/youtube.css is already loaded here for .yt-section-title, so
         this reuses that exact styling instead of duplicating it). -->
    <div class="yt-library">
      <div class="scissor-line" aria-hidden="true"></div>

      <!-- .yt-library-head: same integrated heading+pills row youtube.css's
           own library section uses (css/youtube.css is loaded here too) --
           label left, pill row right, instead of two separately centered
           elements stacked on top of each other. -->
      <div class="yt-library-head" data-twitch-only>
        <h2 class="yt-section-title">Die neusten Streams</h2>
        <div class="vod-section-head" id="twitch-archive-head"></div>
      </div>
      <!-- .yt-shelf-wrap/.yt-shelf-nav: the same shelf-arrow chrome already
           used by youtube.css's own shelves (css/youtube.css is loaded here
           too) -- purely a positioning wrapper + absolutely-positioned
           buttons, so it works around a .vod-row track just as well as
           around a .yt-shelf one without needing its own CSS. -->
      <div class="yt-shelf-wrap" id="twitch-vod-shelf-wrap" data-twitch-only>
        <button type="button" class="yt-shelf-nav yt-shelf-nav--prev is-hidden" aria-label="Zurück scrollen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <div class="vod-row" id="twitch-vod-row"></div>
        <button type="button" class="yt-shelf-nav yt-shelf-nav--next is-hidden" aria-label="Weiter scrollen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>

      <div id="twitch-spotlight-wrap" data-twitch-only>
        <!-- .yt-spotlight-label: youtube.css's lighter-weight uppercase
             label style for this exact "Aus dem Archiv" discovery row --
             was a full .yt-section-title here (same weight as a primary
             heading), mismatched with how the YouTube page treats the
             identically-named row. -->
        <div class="yt-spotlight-label">Aus dem Archiv</div>
        <div class="yt-shelf-wrap" id="twitch-spotlight-shelf-wrap">
          <button type="button" class="yt-shelf-nav yt-shelf-nav--prev is-hidden" aria-label="Zurück scrollen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
          <div class="vod-row vod-row--accent" id="twitch-spotlight-row"></div>
          <button type="button" class="yt-shelf-nav yt-shelf-nav--next is-hidden" aria-label="Weiter scrollen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>

      <div class="yt-library-head">
        <h2 class="yt-section-title">Vom YouTube VOD Kanal (ZevKev+)</h2>
        <div class="vod-section-head" id="vod-section-head"></div>
      </div>

      <!-- Reuses css/youtube.css's .yt-search-* classes (already loaded on
           this page, see the <link> above) instead of duplicating the
           styling -- same search-a-title-as-you-type feature as the
           YouTube page, for this section's own (potentially long,
           load-more-paginated) video list. -->
      <div class="yt-search-row">
        <div class="yt-search-box">
          <svg class="yt-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="vod-search-input" class="yt-search-input" placeholder="Videos durchsuchen…" aria-label="Videos durchsuchen">
          <button type="button" id="vod-search-clear" class="yt-search-clear" aria-label="Suche zurücksetzen" hidden>&times;</button>
        </div>
      </div>

      <div class="vod-section-head" id="vod-sort-bar"></div>
      <div class="vod-grid" id="vod-grid"></div>
      <div class="yt-load-more-row" id="vod-load-more"></div>
    </div>

  </div>
</div>

<div id="site-footer"></div>

<script type="module" src="/js/flags.js"></script>
<script type="module">
  import { mountLayout } from "/js/layout.js";
  mountLayout();
</script>
<script type="module" src="/js/vods.js"></script>
</body>
</html>
