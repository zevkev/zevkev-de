# Cloudflare Pages project config for the ZevKev private dashboard.
# Deployed separately from the main site (zevkev.de / GitHub Pages) at
# privat.zevkev.de.
#
# Deploy with (from the repo root):
#   wrangler pages deploy dashboard/public --project-name=zevkev-privat
#
# See dashboard/README.md for the full one-time setup checklist
# (create the D1 database, run the schema, set secrets, deploy).

name = "zevkev-privat"
compatibility_date = "2026-09-01"
pages_build_output_dir = "public"

# D1 database binding, available in every Pages Function as `env.DB`.
# After running `wrangler d1 create zevkev-privat-db`, paste the
# database_id it prints below (this placeholder will not work as-is).
[[d1_databases]]
binding = "DB"
database_name = "zevkev-privat-db"
database_id = "REPLACE_WITH_DATABASE_ID_FROM_WRANGLER_D1_CREATE"

# Secrets (DASHBOARD_PASSWORD, SESSION_SECRET) are NOT set here -- they're
# set with `wrangler pages secret put <NAME> --project-name=zevkev-privat`
# so they never end up in a file that could be committed or shared.
