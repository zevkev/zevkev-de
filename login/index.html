<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden | ZevKev</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/png" href="https://zevkev.github.io/Medienspeicher/Bilder/neues%20icon.png">
<link rel="apple-touch-icon" href="https://zevkev.github.io/Medienspeicher/Bilder/neues%20icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/login.css">
</head>
<body>

<script type="module" src="/js/theme.js"></script>
<script type="module" src="/js/consent.js"></script>

<div id="site-header"></div>

<div class="page-body">
  <div class="container login-container">
    <div class="login-card rip">
      <div class="tape"></div>
      <div class="auth-tabs">
        <button type="button" class="auth-tab is-active" data-mode="signin">Anmelden</button>
        <button type="button" class="auth-tab" data-mode="signup">Registrieren</button>
      </div>
      <form id="auth-form" novalidate>
        <div class="auth-field" id="auth-username-field" style="display:none;">
          <label for="auth-username">Username</label>
          <input type="text" id="auth-username" autocomplete="nickname">
        </div>
        <div class="auth-field">
          <label for="auth-email">E-Mail</label>
          <input type="email" id="auth-email" required autocomplete="email">
        </div>
        <div class="auth-field">
          <label for="auth-password">Passwort</label>
          <input type="password" id="auth-password" required autocomplete="current-password" minlength="6">
        </div>
        <p class="auth-error" id="auth-error"></p>
        <button type="submit" class="p-btn rip btn-accent auth-submit" id="auth-submit">Anmelden</button>
      </form>
      <div class="auth-divider"><span>oder</span></div>
      <button type="button" class="p-btn rip auth-google" id="auth-google">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.5 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.3 18.9 12 24 12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.5 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.5 26.7 36 24 36c-5.3 0-9.8-3.4-11.3-8.1l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.3 5.6-6.2 7.1l6.2 5.2C38.9 37 44 31 44 24c0-1.3-.1-2.5-.4-3.5z"/></svg>
        Mit Google anmelden
      </button>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script type="module" src="/js/flags.js"></script>
<script type="module">
  import { mountLayout } from "/js/layout.js";
  mountLayout();
</script>
<script type="module" src="/js/login.js"></script>
</body>
</html>
